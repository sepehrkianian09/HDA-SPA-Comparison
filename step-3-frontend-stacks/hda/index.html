<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Desk Shop HDA</title><script src="https://unpkg.com/htmx.org@2.0.4"></script><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}.card{border:1px solid #ddd;padding:1rem;margin:1rem 0;border-radius:8px}button{padding:.5rem}</style></head><body><h1>Desk Shop</h1><form hx-get="/hda/products" hx-target="#products" hx-trigger="keyup changed delay:250ms" hx-push-url="false"><label>Search products <input name="q" placeholder="Try stand"></label></form><div id="summary" hx-get="/hda/cart" hx-trigger="load, cartChanged from:body"></div><section id="products" hx-get="/hda/products" hx-trigger="load"></section><script>document.body.addEventListener('htmx:afterRequest',e=>{if(e.detail.pathInfo?.requestPath.includes('/cart')) document.body.dispatchEvent(new Event('cartChanged'))})</script></body></html>
