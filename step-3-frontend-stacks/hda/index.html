<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Desk Shop HDA</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <main>
      <h1>Desk Shop</h1>

      <form
        hx-get="/hda/products"
        hx-target="#products"
        hx-trigger="keyup changed delay:250ms"
      >
        <label for="product-search">Search products</label>
        <input id="product-search" name="q" placeholder="Try stand">
      </form>

      <section
        id="summary"
        aria-live="polite"
        hx-get="/hda/cart"
        hx-trigger="load"
      ></section>

      <section
        id="products"
        aria-label="Products"
        hx-get="/hda/products"
        hx-trigger="load"
      ></section>
    </main>
  </body>
</html>
